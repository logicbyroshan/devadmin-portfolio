# ========================================================
# DevAdmin Nginx Configuration (Frontend + Backend Reverse Proxy)
# Place at: /etc/nginx/sites-available/devadmin
# ========================================================

upstream django_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Maximum file upload size for avatars and project media
    client_max_body_size 50M;

    # 1. Frontend React Production SPA
    location / {
        root /var/www/devadmin/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Static asset caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }
    }

    # 2. Django REST Framework Backend API & Swagger
    location ~ ^/(api|admin|static|media)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90;
    }

    # 3. Static & Media Directory Mappings (Collected by Django)
    location /static/ {
        alias /var/www/devadmin/backend/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/devadmin/backend/media/;
        expires 30d;
    }

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options SAMEORIGIN;
}
